<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">

<head>
<meta charset="UTF-8" />
<title>Crear Estado General</title>
</head>

<body>
	<div layout:fragment="contenidopaginas">
		<h5 class="card-title fw-semibold mb-4">Registrar Estado General</h5>

		<form th:action="@{/estadosgenerales/guardar}"
			th:object="${estadoGeneral}" method="post">

			<div class="mb-3">
				<label for="nombreEstado" class="form-label">Nombre del
					Estado</label> <input type="text" class="form-control"
					th:field="*{nombreEstado}" id="nombreEstado"
					placeholder="Ej: Pendiente, Procesado, Cancelado" required>
			</div>

			<!-- Campo: Descripción -->
			<div class="mb-3">
				<label for="descripcion" class="form-label">Descripción</label>
				<textarea class="form-control" th:field="*{descripcion}"
					id="descripcion" rows="3"
					placeholder="Descripción opcional del estado"></textarea>
			</div>

			<!-- Campo: Estado (Boolean Activo/Inactivo) -->
			<div class="mb-3 form-check form-switch">
				<input class="form-check-input" type="checkbox" th:field="*{estado}"
					id="estado" role="switch"> <label class="form-check-label"
					for="estado">¿Estado Activo?</label>
			</div>

			<button type="submit" class="btn btn-primary">Guardar Estado</button>
			<a th:href="@{/estadosgenerales}" class="btn btn-secondary">Cancelar</a>
		</form>
	</div>
</body>
</html>
