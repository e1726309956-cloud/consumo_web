<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{plantilla/plantillaui}">

<head>
    <meta charset="UTF-8" />
    <title>Formulario Estado General</title>
</head>

<body>

    <div layout:fragment="contenidopaginas">
        
        <div class="d-flex justify-content-between align-items-center mb-4 pt-2">
            <h5 class="card-title fw-semibold" 
                th:text="${estadoGeneral != null and estadoGeneral.idEstado > 0} ? 'Editar Estado General' : 'Nuevo Estado General'">
                Estado General
            </h5>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                
                <form th:action="@{/estadosGenerales/guardar}" method="post">
                    
                    <!-- ID Oculto para edición (Seguro contra nulos) -->
                    <input type="hidden" name="idEstado" 
                           th:value="${estadoGeneral != null ? estadoGeneral.idEstado : 0}" />

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del Estado</label>
                        <input type="text" class="form-control" name="nombreEstado" 
                               th:value="${estadoGeneral != null ? estadoGeneral.nombreEstado : ''}" 
                               placeholder="Ingrese el nombre" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción</label>
                        <input type="text" class="form-control" name="descripcion" 
                               th:value="${estadoGeneral != null ? estadoGeneral.descripcion : ''}" 
                               placeholder="Ingrese la descripción" required />
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/estadosGenerales}" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>

                </form>

            </div>
        </div>

    </div>

</body>
</html>
