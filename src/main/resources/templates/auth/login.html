<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Iniciar sesión</title>

<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

<link rel="stylesheet" th:href="@{/assets/css/main.css}">

</head>

<body>

	<section class="min-vh-100 d-flex align-items-center bg-light">

		<div class="container">

			<div class="row justify-content-center">

				<div class="col-lg-5 col-md-7">

					<div class="card shadow border-0">

						<div class="card-body p-5">

							<div class="text-center mb-4">

								<h2 class="mb-2">Iniciar sesión</h2>

								<p class="text-muted mb-0">Ingresa a tu cuenta para
									continuar.</p>

							</div>

							<div class="alert alert-danger" th:if="${error}"
								th:text="${error}">Error al iniciar sesión</div>

							<div class="alert alert-success" th:if="${mensaje}"
								th:text="${mensaje}">Registro exitoso</div>

							<form th:action="@{/auth/login}" th:object="${login}"
								method="post">

								<div class="mb-3">

									<label for="correo" class="form-label"> Correo
										electrónico </label> <input type="email" id="correo"
										class="form-control" th:field="*{correo}"
										placeholder="correo@ejemplo.com" required>

								</div>

								<div class="mb-4">

									<label for="contrasena" class="form-label"> Contraseña
									</label> <input type="password" id="contrasena" class="form-control"
										th:field="*{contrasena}" placeholder="Ingrese su contraseña"
										required>

								</div>

								<button type="submit" class="btn btn-primary w-100">

									Iniciar sesión</button>

							</form>

							<div class="text-center mt-4">

								<span class="text-muted"> ¿No tienes una cuenta? </span> <a
									th:href="@{/auth/registro}"> Regístrate </a>

							</div>

						</div>

					</div>

				</div>

			</div>

		</div>

	</section>
	
</body>
</html>
