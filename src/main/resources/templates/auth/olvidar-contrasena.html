<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Recuperar contraseña</title>

<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

<link rel="stylesheet" th:href="@{/assets/css/main.css}">

</head>

<body>

	<section class="min-vh-100 d-flex align-items-center bg-light">

		<div class="container">

			<div class="row justify-content-center">

				<div class="col-lg-5 col-md-7">

					<div class="card shadow border-0">

						<div class="card-body p-5">

							<div class="text-center mb-4">

								<h2 class="mb-2">Recuperar contraseña</h2>

								<p class="text-muted mb-0">Ingresa el correo electrónico
									asociado a tu cuenta.</p>

							</div>

							<div class="alert alert-danger" th:if="${error}"
								th:text="${error}">Ocurrió un error</div>

							<div class="alert alert-success" th:if="${mensaje}"
								th:text="${mensaje}">Se envió el enlace de recuperación</div>

							<form th:action="@{/auth/olvidar-contrasena}" method="post">

								<div class="mb-4">

									<label for="correo" class="form-label"> Correo
										electrónico </label> <input type="email" id="correo" name="correo"
										class="form-control" th:value="${correo}"
										placeholder="correo@ejemplo.com" required>

									<div class="form-text">Recibirás un enlace para crear una
										nueva contraseña.</div>

								</div>

								<button type="submit" class="btn btn-primary w-100">

									Enviar enlace de recuperación</button>

							</form>

							<div class="text-center mt-4">

								<a th:href="@{/auth/login}" class="text-decoration-none">

									Volver al inicio de sesión </a>

							</div>

						</div>

					</div>

				</div>

			</div>

		</div>

	</section>

</body>
</html>
