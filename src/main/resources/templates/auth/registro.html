<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro de cliente</title>

<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

<link rel="stylesheet" th:href="@{/assets/css/main.css}">

</head>

<body>

	<section class="min-vh-100 d-flex align-items-center bg-light py-5">

		<div class="container">

			<div class="row justify-content-center">

				<div class="col-lg-7 col-md-9">

					<div class="card shadow border-0">

						<div class="card-body p-5">

							<div class="text-center mb-4">

								<h2 class="mb-2">Crear una cuenta</h2>

								<p class="text-muted mb-0">Regístrate para realizar tus
									pedidos.</p>

							</div>

							<div class="alert alert-danger" th:if="${error}"
								th:text="${error}">Error al registrar usuario</div>

							<form th:action="@{/auth/registro}" th:object="${usuario}"
								method="post">

								<div class="row">

									<div class="col-md-6 mb-3">

										<label for="nombre" class="form-label"> Nombre </label> <input
											type="text" id="nombre" class="form-control"
											th:field="*{nombre}" placeholder="Ingrese su nombre"
											minlength="2" maxlength="100" required>

									</div>

									<div class="col-md-6 mb-3">

										<label for="apellido" class="form-label"> Apellido </label> <input
											type="text" id="apellido" class="form-control"
											th:field="*{apellido}" placeholder="Ingrese su apellido"
											minlength="2" maxlength="100" required>

									</div>

								</div>

								<div class="row">

									<div class="col-md-6 mb-3">

										<label for="cedula" class="form-label"> Cédula </label> <input
											type="text" id="cedula" class="form-control"
											th:field="*{cedula}" placeholder="10 dígitos"
											pattern="[0-9]{10}" maxlength="10" inputmode="numeric"
											required> <small class="text-muted"> Debe
											contener exactamente 10 dígitos. </small>

									</div>

									<div class="col-md-6 mb-3">

										<label for="celular" class="form-label"> Celular </label> <input
											type="text" id="celular" class="form-control"
											th:field="*{celular}" placeholder="10 dígitos"
											pattern="[0-9]{10}" maxlength="10" inputmode="numeric"
											required>

									</div>

								</div>

								<div class="mb-3">

									<label for="correo" class="form-label"> Correo
										electrónico </label> <input type="email" id="correo"
										class="form-control" th:field="*{correo}"
										placeholder="correo@ejemplo.com" required>

								</div>

								<div class="mb-4">

									<label for="contrasena" class="form-label"> Contraseña
									</label> <input type="password" id="contrasena" class="form-control"
										th:field="*{contrasena}" placeholder="Mínimo 6 caracteres"
										minlength="6" required> <small class="text-muted">
										Utiliza al menos 6 caracteres. </small>

								</div>

								<button type="submit" class="btn btn-primary w-100">

									Crear cuenta</button>

							</form>

							<div class="text-center mt-4">

								<span class="text-muted"> ¿Ya tienes una cuenta? </span> <a
									th:href="@{/auth/login}"> Inicia sesión </a>

							</div>

						</div>

					</div>

				</div>

			</div>

		</div>

	</section>
	<script>
		const correo = document.getElementById("correo");

		correo
				.addEventListener(
						"input",
						function() {

							const regex = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

							if (!regex.test(this.value)) {

								this
										.setCustomValidity("Ingrese un correo válido. Ejemplo: usuario@gmail.com");

							} else {

								this.setCustomValidity("");

							}

						});
	</script>

</body>
</html>
